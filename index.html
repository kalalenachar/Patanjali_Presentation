<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Verified Sanskrit AI — Presenter Mode</title>
  
  <!-- Modern Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800;900&family=Outfit:wght@300;400;500;600;700&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  
  <style>
    /* CSS RESET */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    :root {
      --font-display: 'Cinzel', serif;
      --font-body: 'Outfit', 'Plus Jakarta Sans', sans-serif;
      --transition-crossfade: 700ms cubic-bezier(0.16, 1, 0.3, 1);
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #000000;
      color: #ffffff;
      font-family: var(--font-body);
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    /* Auto-hide cursor when idle */
    body.idle-cursor {
      cursor: none;
    }

    /* MAIN VIEWPORT */
    #viewport {
      position: relative;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: #000;
    }

    /* Subtle ambient floating stardust particles */
    #ambient-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 4;
      opacity: 0.65;
    }

    /* STAGE CONTAINER */
    #stage-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      z-index: 1;
    }

    /* Dual Stage Buffers for Flawless Seamless Crossfade */
    .stage-layer {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      opacity: 0;
      visibility: hidden;
      overflow: hidden;
      will-change: opacity, transform;
      transition: opacity var(--transition-crossfade), transform var(--transition-crossfade);
      transform: scale(1.02);
    }

    .stage-layer.active {
      opacity: 1;
      visibility: visible;
      transform: scale(1);
      z-index: 2;
    }

    .stage-layer.outgoing {
      opacity: 0;
      visibility: visible;
      transform: scale(1.04);
      z-index: 1;
    }

    .stage-layer img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
      display: block;
      transform-origin: center center;
      will-change: transform;
    }

    /* LIVE EFFECT: KEN BURNS CONTINUOUS CAMERA MOTION */
    .motion-zoom-in img {
      animation: liveZoomIn 16s cubic-bezier(0.25, 1, 0.5, 1) infinite alternate;
    }
    .motion-pan-right img {
      animation: livePanRight 18s cubic-bezier(0.25, 1, 0.5, 1) infinite alternate;
    }
    .motion-zoom-out img {
      animation: liveZoomOut 16s cubic-bezier(0.25, 1, 0.5, 1) infinite alternate;
    }
    .motion-pan-left img {
      animation: livePanLeft 18s cubic-bezier(0.25, 1, 0.5, 1) infinite alternate;
    }
    .motion-drift-up img {
      animation: liveDriftUp 17s cubic-bezier(0.25, 1, 0.5, 1) infinite alternate;
    }
    .motion-diagonal img {
      animation: liveDiagonal 19s cubic-bezier(0.25, 1, 0.5, 1) infinite alternate;
    }

    @keyframes liveZoomIn {
      0% { transform: scale(1.0) translate(0, 0); }
      100% { transform: scale(1.11) translate(-1.2%, -0.8%); }
    }
    @keyframes livePanRight {
      0% { transform: scale(1.08) translate(-2%, 0.5%); }
      100% { transform: scale(1.12) translate(2%, -0.5%); }
    }
    @keyframes liveZoomOut {
      0% { transform: scale(1.14) translate(0, 1%); }
      100% { transform: scale(1.02) translate(0, -0.8%); }
    }
    @keyframes livePanLeft {
      0% { transform: scale(1.08) translate(2%, -0.5%); }
      100% { transform: scale(1.12) translate(-2%, 0.5%); }
    }
    @keyframes liveDriftUp {
      0% { transform: scale(1.05) translate(0, 1.8%); }
      100% { transform: scale(1.11) translate(0, -1.8%); }
    }
    @keyframes liveDiagonal {
      0% { transform: scale(1.06) translate(-1.5%, 1.2%); }
      100% { transform: scale(1.12) translate(1.5%, -1.2%); }
    }

    /* Subtle Natural Vignette (Soft top gradient for uncompromised text contrast) */
    .vignette-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 3;
      background: radial-gradient(circle at center, transparent 48%, rgba(0, 0, 0, 0.3) 85%, rgba(0, 0, 0, 0.7) 100%),
                  linear-gradient(to bottom, rgba(0, 0, 0, 0.75) 0%, rgba(0, 0, 0, 0.35) 14%, transparent 25%);
    }

    /* -------------------------------------------------------------
       PLAIN TEXT LAYER (SINGLE LINE AT TOP MIDDLE, ZERO BOX, UNCOVERED)
       ------------------------------------------------------------- */
    #text-overlay {
      position: absolute;
      top: 42px;
      left: 50%;
      transform: translateX(-50%);
      width: 90%;
      max-width: 1400px;
      text-align: center;
      z-index: 10;
      pointer-events: none;
      transition: opacity 280ms ease, transform 280ms cubic-bezier(0.16, 1, 0.3, 1);
    }

    #text-overlay.text-animating {
      opacity: 0;
      transform: translateX(-50%) translateY(-8px);
    }

    .plain-heading {
      font-family: var(--font-display);
      font-size: clamp(1.35rem, 2.3vw, 2.25rem);
      font-weight: 700;
      line-height: 1.25;
      color: #ffffff;
      margin: 0;
      letter-spacing: 0.02em;
      text-align: center;
      text-shadow: 0 2px 10px rgba(0, 0, 0, 0.95), 0 4px 28px rgba(0, 0, 0, 0.9), 0 0 5px rgba(0, 0, 0, 1);
    }

    #presenter-toast {
      display: none !important;
    }

    /* Clickable screen zones for presenter clickers & touch */
    .click-zone {
      position: absolute;
      top: 0;
      bottom: 0;
      z-index: 8;
      cursor: pointer;
    }
    #click-zone-left {
      left: 0;
      width: 25%;
    }
    #click-zone-right {
      right: 0;
      width: 75%;
    }

    @media (max-width: 768px) {
      #text-overlay {
        top: 22px;
        width: 94%;
      }
      .plain-heading {
        font-size: 1.2rem;
      }
      #presenter-toast {
        bottom: 20px;
        right: 20px;
      }
    }
  </style>

      if (now - lastKeypressTime < KEY_DEBOUNCE_MS) {
        return; // Debounce rapid key hammering
      }
      lastKeypressTime = now;

      switch (e.key) {
        case 'ArrowRight':
        case 'PageDown':
        case 'KeyD':
        case 'Enter':
          e.preventDefault();
          nextSlide();
          break;
        case 'ArrowLeft':
        case 'PageUp':
        case 'KeyA':
        case 'Backspace':
          e.preventDefault();
          prevSlide();
          break;
        case ' ':
          e.preventDefault();
          nextSlide(); // In presenter mode, space typically advances slide
          break;
        case 'KeyP':
          e.preventDefault();
          toggleAutoPlay();
          break;
        case 'KeyF':
          e.preventDefault();
          toggleFullscreen();
          break;
        case 'KeyT':
          e.preventDefault();
          // Toggle text visibility
          if (textOverlay.style.display === 'none') {
            textOverlay.style.display = 'block';
            showToast('Text Visible');
          } else {
            textOverlay.style.display = 'none';
            showToast('Text Hidden');
          }
          break;
        case 'Home':
          e.preventDefault();
          goToSlide(0);
          break;
        case 'End':
          e.preventDefault();
          goToSlide(totalSlides - 1);
          break;
      }
    });

    // Touch Swipe Navigation for mobile & tablet
    let touchStartX = 0;
    let touchStartY = 0;
    window.addEventListener('touchstart', (e) => {
      touchStartX = e.changedTouches[0].screenX;
      touchStartY = e.changedTouches[0].screenY;
    }, { passive: true });

    window.addEventListener('touchend', (e) => {
      const diffX = e.changedTouches[0].screenX - touchStartX;
      const diffY = e.changedTouches[0].screenY - touchStartY;
      if (Math.abs(diffX) > 40 && Math.abs(diffX) > Math.abs(diffY)) {
        if (diffX < 0) {
          nextSlide();
        } else {
          prevSlide();
        }
      }
    }, { passive: true });

    // Auto-hide cursor when idle (2 seconds)
    function setupIdleCursor() {
      let idleTimer = null;
      function onActivity() {
        document.body.classList.remove('idle-cursor');
        clearTimeout(idleTimer);
        idleTimer = setTimeout(() => {
          document.body.classList.add('idle-cursor');
        }, 2000);
      }
      window.addEventListener('mousemove', onActivity);
      window.addEventListener('mousedown', onActivity);
      window.addEventListener('keydown', onActivity);
      onActivity();
    }

    // Ambient Stardust Particles
    function setupAmbientParticles() {
      const canvas = document.getElementById('ambient-canvas');
      const ctx = canvas.getContext('2d');
      let width = canvas.width = window.innerWidth;
      let height = canvas.height = window.innerHeight;

      window.addEventListener('resize', () => {
        width = canvas.width = window.innerWidth;
        height = canvas.height = window.innerHeight;
      });

      const particleCount = 24;
      const particles = [];
      for (let i = 0; i < particleCount; i++) {
        particles.push({
          x: Math.random() * width,
          y: Math.random() * height,
          radius: Math.random() * 2.0 + 0.8,
          speedY: -(Math.random() * 0.35 + 0.15),
          speedX: (Math.random() - 0.5) * 0.25,
          alpha: Math.random() * 0.5 + 0.2,
          pulse: Math.random() * 0.02 + 0.01
        });
      }

      function drawParticles() {
        ctx.clearRect(0, 0, width, height);
        particles.forEach(p => {
          p.y += p.speedY;
          p.x += p.speedX;
          p.alpha += Math.sin(p.pulse) * 0.006;

          if (p.y < -10) {
            p.y = height + 10;
            p.x = Math.random() * width;
          }
          if (p.x < 0) p.x = width;
          if (p.x > width) p.x = 0;

          ctx.beginPath();
          ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
          ctx.fillStyle = `rgba(245, 176, 65, ${Math.max(0.1, Math.min(0.8, p.alpha))})`;
          ctx.shadowBlur = 8;
          ctx.shadowColor = '#f5b041';
          ctx.fill();
        });

        requestAnimationFrame(drawParticles);
      }

      requestAnimationFrame(drawParticles);
    }

    // Run on load
    window.addEventListener('DOMContentLoaded', init);
  </script>
</body>
</html>
